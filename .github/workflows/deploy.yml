name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, tiranidos]
    concurrency:
      group: bench-restart-tiranidos
      cancel-in-progress: false

    steps:
      - name: Pull changes
        run: |
          cd ~/frappe-bench/apps/finhub
          git pull origin main

      - name: Migrate if doctypes changed
        run: |
          cd ~/frappe-bench/apps/finhub
          if git diff HEAD~1 --name-only | grep -q "finhub/doctype/"; then
            echo "Doctypes modificados, ejecutando migrate..."
            cd ~/frappe-bench
            bench --site all migrate
          else
            echo "Sin cambios en doctypes, skip migrate."
          fi

      - name: Restart and clear cache
        run: |
          cd ~/frappe-bench
          bench restart
          bench --site all clear-cache
